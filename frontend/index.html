<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEX Architecture Lab</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}form{display:grid;gap:12px;max-width:420px}input,select,button{padding:10px;font:inherit}#out{white-space:pre-wrap;background:#111;color:#eee;padding:16px;margin-top:20px}</style></head>
<body><h1>CEX Order Console</h1><p>Educational exchange workflow: browser → Java API → order state machine.</p><form id="order"><input id="clientOrderId" placeholder="Client order ID" required pattern="[A-Z0-9_-]{3,40}"><input id="symbol" value="BTC-USDT" required><select id="side"><option>BUY</option><option>SELL</option></select><input id="quantity" type="number" min="0.00000001" step="0.00000001" value="0.01" required><button>Create idempotent order</button></form><pre id="out">Ready.</pre><script>const f=document.querySelector('#order'),o=document.querySelector('#out');f.addEventListener('submit',async e=>{e.preventDefault();o.textContent='Submitting…';try{const r=await fetch('http://localhost:8080/api/v1/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientOrderId:clientOrderId.value,symbol:symbol.value.toUpperCase(),side:side.value,quantity:Number(quantity.value)})});o.textContent=JSON.stringify(await r.json(),null,2)}catch(err){o.textContent='API unavailable: '+err.message}});</script></body></html>
