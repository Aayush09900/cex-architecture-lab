name: Git Check

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f README.md
          test -f .github/workflows/git-check.yml
          echo "Project structure check passed!"