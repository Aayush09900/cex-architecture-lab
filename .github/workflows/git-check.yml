name: CEX CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run project tests
        run: |
          chmod +x tests/test-project.sh
          ./tests/test-project.sh

  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f tests/test-project.sh
          test -f .github/workflows/git-check.yml
          echo "Project validation passed!"